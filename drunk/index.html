<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🍷 又 喝 多 了</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: #0a0a0a;
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            color: #eee;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
        }

        .bg-text {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            display: flex;
            justify-content: space-evenly;
            align-items: flex-start;
            padding: 0 10px;
        }

        .bg-text span {
            writing-mode: vertical-rl;
            font-size: 18px;
            color: rgba(180, 50, 50, 0.25);
            letter-spacing: 8px;
            white-space: nowrap;
            animation: floatUp linear infinite;
            font-weight: 300;
            user-select: none;
            flex-shrink: 0;
        }

        .bg-text span:nth-child(1) { animation-duration: 14s; animation-delay: 0s; font-size: 20px; }
        .bg-text span:nth-child(2) { animation-duration: 18s; animation-delay: 2s; font-size: 15px; }
        .bg-text span:nth-child(3) { animation-duration: 12s; animation-delay: 4s; font-size: 18px; }
        .bg-text span:nth-child(4) { animation-duration: 16s; animation-delay: 1s; font-size: 14px; }
        .bg-text span:nth-child(5) { animation-duration: 13s; animation-delay: 3s; font-size: 22px; }
        .bg-text span:nth-child(6) { animation-duration: 19s; animation-delay: 5s; font-size: 16px; }
        .bg-text span:nth-child(7) { animation-duration: 15s; animation-delay: 0.5s; font-size: 18px; }
        .bg-text span:nth-child(8) { animation-duration: 20s; animation-delay: 3.5s; font-size: 14px; }
        .bg-text span:nth-child(9) { animation-duration: 11s; animation-delay: 2.5s; font-size: 19px; }
        .bg-text span:nth-child(10) { animation-duration: 17s; animation-delay: 4.5s; font-size: 15px; }
        .bg-text span:nth-child(11) { animation-duration: 14s; animation-delay: 1.5s; font-size: 21px; }
        .bg-text span:nth-child(12) { animation-duration: 16s; animation-delay: 3s; font-size: 14px; }
        .bg-text span:nth-child(13) { animation-duration: 12s; animation-delay: 2s; font-size: 18px; }
        .bg-text span:nth-child(14) { animation-duration: 18s; animation-delay: 4s; font-size: 16px; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(-2deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(2deg); opacity: 0; }
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            gap: 0;
            background: rgba(10, 5, 5, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(80, 30, 30, 0.25);
            border-radius: 12px;
            overflow: hidden;
        }

        .left-panel {
            flex: 0 0 320px;
            padding: 30px 20px 30px 30px;
            border-right: 1px solid rgba(60, 30, 30, 0.25);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .left-panel::-webkit-scrollbar {
            width: 3px;
        }
        .left-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .left-panel::-webkit-scrollbar-thumb {
            background: #3a1a1a;
            border-radius: 4px;
        }

        .back-link {
            display: inline-block;
            color: #5a3a3a;
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 16px;
            font-family: 'Press Start 2P', monospace;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .back-link:hover {
            color: #8a5a5a;
        }

        .left-title {
            font-size: 22px;
            color: #7a3a3a;
            font-weight: 300;
            letter-spacing: 4px;
            font-family: 'Press Start 2P', monospace;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .left-sub {
            font-size: 12px;
            color: #3a2a2a;
            letter-spacing: 3px;
            margin-bottom: 20px;
            border-bottom: 1px solid #1a0a0a;
            padding-bottom: 14px;
            flex-shrink: 0;
        }

        .poem-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .poem-title {
            display: block;
            color: #6a5a5a;
            text-decoration: none;
            font-size: 18px;
            padding: 12px 14px;
            transition: 0.15s ease;
            font-weight: 300;
            letter-spacing: 2px;
            cursor: pointer;
            background: transparent;
            border: none;
            border-radius: 0;
            text-align: left;
            font-family: 'Noto Serif SC', serif;
        }

        .poem-title:hover {
            color: #aa7a7a;
            padding-left: 20px;
        }

        .poem-title.active {
            color: #c08a8a;
            padding-left: 22px;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .right-panel {
            flex: 1;
            padding: 50px 60px;
            overflow-y: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .right-panel::-webkit-scrollbar {
            width: 4px;
        }
        .right-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .right-panel::-webkit-scrollbar-thumb {
            background: #3a1a1a;
            border-radius: 4px;
        }

        .poem-display {
            max-width: 700px;
            width: 100%;
        }

        .poem-display .poem-title-large {
            font-size: 28px;
            color: #9a6a6a;
            font-weight: 300;
            letter-spacing: 6px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a1a1a;
            padding-bottom: 16px;
        }

        .poem-display .poem-body {
            font-size: 20px;
            line-height: 2.6;
            color: #8a7a7a;
            font-weight: 300;
            white-space: pre-wrap;
        }

        .poem-display .poem-body .red {
            color: #7a3a3a;
        }
        .poem-display .poem-body .small {
            font-size: 16px;
            color: #5a4a4a;
        }
        .poem-display .poem-body .big {
            font-size: 28px;
            color: #6a3a3a;
        }

        .footer {
            max-width: 1600px;
            width: 100%;
            margin: 10px auto 0;
            text-align: center;
            font-size: 11px;
            padding: 10px 0 4px;
            color: #2a1a1a;
            border-top: 1px solid #1a0a0a;
            letter-spacing: 3px;
            font-family: 'Press Start 2P', monospace;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .footer .blink {
            animation: blink 1.2s step-end infinite;
            color: #3a2a2a;
        }
        @keyframes blink {
            50% { opacity: 0.1; }
        }

        @media (max-width: 820px) {
            .container {
                flex-direction: column;
                border-radius: 8px;
            }
            .left-panel {
                flex: none;
                border-right: none;
                border-bottom: 1px solid rgba(60, 30, 30, 0.25);
                max-height: 260px;
                padding: 16px 18px;
            }
            .right-panel {
                padding: 24px 20px;
                flex: 1;
            }
            .poem-display .poem-title-large {
                font-size: 20px;
            }
            .poem-display .poem-body {
                font-size: 16px;
                line-height: 2.2;
            }
            .left-title {
                font-size: 18px;
            }
            .poem-title {
                font-size: 15px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 背景飘浮的竖排诗句 ===== -->
    <div class="bg-text">
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
        <span>诗 句 占 位</span>
    </div>

    <!-- ===== 主容器 ===== -->
    <div class="container">

        <!-- 左列 -->
        <div class="left-panel">
            <a href="../index.html" class="back-link">← 返 回</a>
            <div class="left-title">🍷 标 题 占 位</div>
            <div class="left-sub">— 副 标 题 占 位 —</div>

            <div class="poem-list" id="poemList">
                <div class="poem-title active" data-index="0">▸ 标 题 占 位 1</div>
                <div class="poem-title" data-index="1">▸ 标 题 占 位 2</div>
                <div class="poem-title" data-index="2">▸ 标 题 占 位 3</div>
                <div class="poem-title" data-index="3">▸ 标 题 占 位 4</div>
                <div class="poem-title" data-index="4">▸ 标 题 占 位 5</div>
                <div class="poem-title" data-index="5">▸ 标 题 占 位 6</div>
            </div>
        </div>

        <!-- 右列 -->
        <div class="right-panel" id="rightPanel">
            <div class="poem-display" id="poemDisplay">
                <div class="poem-title-large">诗 歌 标 题 占 位</div>
                <div class="poem-body">
                    诗 歌 内 容 占 位 <br>
                    诗 歌 内 容 占 位 <br>
                    诗 歌 内 容 占 位 <br>
                    <span class="small">— 占 位 符 —</span>
                </div>
            </div>
        </div>

    </div>

    <div class="footer">
        <span class="blink">🍷</span> 页 脚 占 位 <span class="blink">🍷</span>
    </div>

    <script>
        // ===== 占位符诗歌数据 =====
        const poems = [{
            title: '诗 歌 标 题 占 位 1',
            body: `诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n<span class="small">— 占 位 符 —</span>`
        }, {
            title: '诗 歌 标 题 占 位 2',
            body: `诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n<span class="small">— 占 位 符 —</span>`
        }, {
            title: '诗 歌 标 题 占 位 3',
            body: `诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n<span class="small">— 占 位 符 —</span>`
        }, {
            title: '诗 歌 标 题 占 位 4',
            body: `诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n<span class="small">— 占 位 符 —</span>`
        }, {
            title: '诗 歌 标 题 占 位 5',
            body: `诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n<span class="small">— 占 位 符 —</span>`
        }, {
            title: '诗 歌 标 题 占 位 6',
            body: `诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n诗 歌 内 容 占 位 \n<span class="small">— 占 位 符 —</span>`
        }];

        const titles = document.querySelectorAll('.poem-title');
        const display = document.getElementById('poemDisplay');

        titles.forEach((el, index) => {
            el.addEventListener('click', function() {
                titles.forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                const poem = poems[index];
                display.innerHTML = `
                    <div class="poem-title-large">${poem.title}</div>
                    <div class="poem-body">${poem.body}</div>
                `;
            });
        });
    </script>

</body>
</html>
