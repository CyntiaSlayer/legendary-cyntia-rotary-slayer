<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>垃圾堆</title>
    
    <!-- 像素风格字体（Google Fonts） -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* ========== 全局重置 & 古早噪点背景 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2d1b3d; /* 深紫黑底 */
            font-family: 'Press Start 2P', monospace; /* 像素字体 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* ⚡ 古早噪点纹理（经典千禧年网站特效） */
            background-image: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }

        /* ========== 主容器——像素粗边框 ========== */
        .container {
            max-width: 1100px;
            width: 100%;
            background-color: #f0e6d2; /* 旧纸色 */
            border: 6px solid #4a2c2c;
            padding: 20px;
            box-shadow: 
                12px 12px 0 #2d1b3d,
                inset -4px -4px 0 #4a2c2c;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            /* 再叠一层轻微扭曲感 */
            transform: rotate(0.3deg);
        }

        /* ========== 左侧栏（头像 + 简介） ========== */
        .sidebar {
            flex: 1;
            min-width: 220px;
            background: #c9b79b;
            padding: 20px;
            border: 4px solid #4a2c2c;
            box-shadow: inset -4px -4px 0 #6b4f3a;
            text-align: center;
            /* 让文字也带点歪斜 */
            transform: rotate(-0.5deg);
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border: 5px solid #4a2c2c;
            /* 像素风头像框——用emoji或纯色块代替 */
            background: #d94f4f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            image-rendering: pixelated;
            box-shadow: 6px 6px 0 #2d1b3d;
        }

        .sidebar h2 {
            font-size: 14px;
            color: #2d1b3d;
            text-shadow: 2px 2px 0 #b89b7a;
            letter-spacing: 1px;
            margin-top: 10px;
            border-bottom: 3px dotted #4a2c2c;
            padding-bottom: 10px;
        }

        .sidebar p {
            font-size: 10px;
            color: #3d2b1f;
            line-height: 1.8;
            margin-top: 12px;
            background: #dfd0b8;
            padding: 12px;
            border: 2px dashed #4a2c2c;
        }

        /* 古早小装饰——闪烁文字 */
        .blink {
            animation: blink 1s step-end infinite;
            color: #b22222;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ========== 右侧主内容（导航链接） ========== */
        .main {
            flex: 2;
            min-width: 260px;
            background: #e8dcc8;
            padding: 25px;
            border: 4px solid #4a2c2c;
            box-shadow: inset -4px -4px 0 #6b4f3a;
            transform: rotate(0.8deg);
        }

        .main h1 {
            font-size: 16px;
            color: #2d1b3d;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 6px double #4a2c2c;
            padding-bottom: 15px;
            margin-bottom: 25px;
            word-break: break-word;
        }

        /* ===== 怪诞链接卡片 ===== */
        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-item {
            display: block;
            background: #d4c3aa;
            padding: 18px 22px;
            border: 4px solid #4a2c2c;
            color: #2d1b3d;
            text-decoration: none;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 6px 6px 0 #2d1b3d;
            transition: all 0.08s linear;
            position: relative;
            /* 每个链接不同颜色 —— 怪诞感 */
        }

        /* 三个链接不同底色 */
        .link-item:nth-child(1) { background: #e8b4b4; } /* 操蛋人生 */
        .link-item:nth-child(2) { background: #b4c9a8; } /* 拉拉大便 */
        .link-item:nth-child(3) { background: #c9b4d9; } /* 又喝多了 */

        /* 鼠标悬停 —— 像素风位移抖动 */
        .link-item:hover {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #2d1b3d;
            background: #f5e6c4;
        }

        /* 链接前面的小符号（古早装饰） */
        .link-item::before {
            content: "☞ ";
            font-size: 22px;
            color: #b22222;
            margin-right: 10px;
        }

        /* ========== 页脚（可选） ========== */
        .footer {
            width: 100%;
            margin-top: 20px;
            text-align: center;
            font-size: 9px;
            color: #6b4f3a;
            border-top: 4px double #4a2c2c;
            padding-top: 15px;
            letter-spacing: 2px;
            transform: rotate(-0.3deg);
        }

        .footer .blink {
            color: #b22222;
        }

        /* ========== 响应式：手机变小 ========== */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                padding: 12px;
            }
            .sidebar {
                transform: none;
            }
            .main {
                transform: none;
            }
            .link-item {
                font-size: 13px;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== 左侧：头像 + 简介 ===== -->
    <div class="sidebar">
        <div class="avatar">👾</div>
        <h2>✦ 废 柴 狗  ✦</h2>
        <p>
            <span class="blink">⬇</span> 互联网拾荒者<br>
            专业摆烂 业余发疯<br>
            喜欢像素、噪点、低保真<br>
            <span style="font-size: 14px; color:#b22222;">⏣</span> 生于1999 死于酒桌 <span style="font-size: 14px; color:#b22222;">⏣</span>
        </p>
        <p style="margin-top: 15px; font-size: 9px; background: #c9b79b; border: 2px solid #4a2c2c;">
            🕸️  best viewed with<br>
            <span style="font-size: 14px;">Netscape 4.0</span>
        </p>
    </div>

    <!-- ===== 右侧：链接大栏目 ===== -->
    <div class="main">
        <h1>⬛ 点 我 进 入 黑 暗 ⬛</h1>

        <div class="link-grid">
            <!-- 操蛋人生 -->
            <a href="#" class="link-item" onclick="alert('🍻 人生就是操蛋 但还得继续干杯'); return false;">
                操 蛋 人 生
            </a>
            <!-- 拉拉大便 -->
            <a href="#" class="link-item" onclick="alert('💩 拉完又是一条好汉'); return false;">
                拉 拉 大 便
            </a>
            <!-- 又喝多了 -->
            <a href="#" class="link-item" onclick="alert('🥴 今朝有酒今朝醉 明天继续当废柴'); return false;">
                又 喝 多 了
            </a>
        </div>

        <!-- 古早计数器装饰 -->
        <div style="text-align: right; margin-top: 25px; font-size: 9px; color: #6b4f3a; border-top: 2px dotted #4a2c2c; padding-top: 12px;">
            <span class="blink">✦</span> 访问量: 0000001 <span class="blink">✦</span>
        </div>
    </div>

    <!-- ===== 页脚（可选） ===== -->
    <div class="footer">
        <span class="blink">⚡</span> 本 站 由 宿 醉 和 失 败 驱 动  <span class="blink">⚡</span><br>
        <span style="font-size: 8px;">© 2026  Internet Garbage</span>
    </div>

</div>

</body>
</html>
